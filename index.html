<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przerwa techniczna</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #333;
        }

        .container {
            max-width: 680px;
            width: 100%;
        }

        img {
            max-width: 300px;
            width: 100%;
            height: auto;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 26px;
            color: #333;
        }

        p {
            max-width: 600px;
            margin: 0 auto 18px;
            font-size: 18px;
            line-height: 1.5;
            color: #666;
        }

        .highlight {
            /* color: #d9534f; */
            font-weight: bold;
        }

        .contact {
            margin-top: 20px;
            font-size: 16px;
            color: #555;
        }

        .contact a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .contact a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="container">
        <img src="MMS_sygnet_czern.png" alt="MMS Logo">

        <h1>Przerwa techniczna</h1>

        <p>
            Trwają prace utrzymaniowe mms.edu.pl
            <br>
            Platforma będzie chwilowo niedostępna. Niedługo wracamy.
            

        <p>
            Dziękujemy za wyrozumiałość,
            <br>
            Zespół MMS
        </p>
    </main>
</body>
</html>
